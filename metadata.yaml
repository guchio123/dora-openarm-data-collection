# Dataset metadata for every robot. The UI and the recorder read the common
# part below and merge `robots.$ROBOT` over it (dicts merge key by key,
# anything else is replaced).
#
# Changing anything here for a robot that already has a dataset under
# data/$LEADER-$ROBOT/ makes the recorder refuse to start; move that
# dataset away first.

location: Lab
operator: Tester

# Pick one at launch with TASK=<index or prompt>; Skip in the UI moves on.
tasks:
  - prompt: Pick a spoon.
    description: Pick a spoon on a table.

  - prompt: Pick a cup.
    description: Pick a cup on a table.

equipment:
  id: Test
  version: "1.0"
  embodiments:
    arms:
      id: OpenArm
      version: "2.0"
  perceptions:
    cameras: {}

robots:
  cell:
    equipment:
      embodiments:
        lifter:
          id: OpenArmCellLifter
          version: "1.0"
          mechanism: lead_screw
          lead_length: 5.0
          stroke: 300
          home: bottom
          unit: mm
      perceptions:
        cameras:
          wrist_left: {}
          wrist_right: {}
          ceiling: {}
          head_left: {}
          head_right: {}
          # ZED Mini depth aligned with head_left, 16-bit PNG in mm (0: no depth).
          head_depth: {}

  # Arms only, no cameras.
  pedestal: {}

  # pedestal plus a MuJoCo viewer, which records nothing.
  pedestal-viz: {}

  pedestal-zed:
    equipment:
      perceptions:
        cameras:
          wrist_left: {}
          wrist_right: {}
          head_left: {}
          head_right: {}
          # ZED Mini depth aligned with head_left, 16-bit PNG in mm (0: no depth).
          head_depth: {}

  mujoco:
    equipment:
      perceptions:
        cameras: &five_cameras
          wrist_left: {}
          wrist_right: {}
          ceiling: {}
          head_left: {}
          head_right: {}

  dummy:
    equipment:
      perceptions:
        cameras: *five_cameras
