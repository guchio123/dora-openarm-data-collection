# ROBOT=pedestal-zed: robot-pedestal plus a ZED Mini on the head and USB
# cameras on the wrists. Followers on CAN, no lifter; the ZED gives the head
# images and depth.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-pedestal-zed
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - camera_head_depth
    - camera_head_depth_preview
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: ../dora-openarm-impedance
    # dora-openarm with gravity compensation and soft joint gains, so the arm
    # holds its own weight and yields when it touches something
    # (docs/teleop.md, Impedance). IMPEDANCE=off runs plain dora-openarm.
    env:
      IMPEDANCE: "${IMPEDANCE:-on}"
      # kp for joints 1-7, e.g. "30,30,20,20,5,5,5"; empty: 20,20,12,12,10,10,10.
      IMPEDANCE_KP: "${IMPEDANCE_KP:-}"
      GRAVITY_SCALE: "${GRAVITY_SCALE:-1.0}"
      # Fraction of the commands' joint velocity sent as dq; 0 brakes every motion.
      IMPEDANCE_VELOCITY_FF: "${IMPEDANCE_VELOCITY_FF:-1.0}"
      # Nm per joint 1-7 added along the motion while a joint trails; empty:
      # 0.52,0.34,0.38,0.69,0.07,0.13,0.11, all zeros for none.
      IMPEDANCE_FRICTION: "${IMPEDANCE_FRICTION:-}"
      # Seconds between log lines on how late commands arrive; 0 for none.
      LATENCY_LOG_S: "${LATENCY_LOG_S:-10}"
    args: "-- --side right --align-trigger gripper --config configs/openarm_pedestal_teleop.yaml"
    inputs:
      # Event ID is only used. Event value isn't used.
      # The quittable tick, not the position: the gate sends nothing until it
      # has seen a state, so tying the state to the command never starts.
      request_state: _mod/tick
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: ../dora-openarm-impedance
    # As the right arm.
    env:
      IMPEDANCE: "${IMPEDANCE:-on}"
      IMPEDANCE_KP: "${IMPEDANCE_KP:-}"
      GRAVITY_SCALE: "${GRAVITY_SCALE:-1.0}"
      IMPEDANCE_VELOCITY_FF: "${IMPEDANCE_VELOCITY_FF:-1.0}"
      IMPEDANCE_FRICTION: "${IMPEDANCE_FRICTION:-}"
      LATENCY_LOG_S: "${LATENCY_LOG_S:-10}"
    # openarm_pedestal with about an eighth of the grip force; see the file.
    args: "-- --side left --align-trigger gripper --config configs/openarm_pedestal_soft_gripper.yaml"
    inputs:
      request_state: _mod/tick
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  # Renames the followers' outputs to the common names.
  - id: arms
    path: ../dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      # Not sent by the pedestal.
      - elevation_action
      - elevation_observation

  # ZED Mini on the head. One grab gives the rectified left and right images
  # and the depth of the same exposure; see nodes/dora-openarm-zed. It
  # depends only on `camera_tick`, so it stops by itself on Quit.
  - id: head-zed
    path: ../dora-openarm-zed
    env:
      # Please configure! 0 opens the first ZED camera.
      SERIAL_NUMBER: 0
      RESOLUTION: "HD720"
      FPS: 30
      DEPTH_MODE: "NEURAL"
      # The ZED Mini can't see closer than 100 mm.
      DEPTH_MINIMUM: 100
      DEPTH_MAXIMUM: 3000
      JPEG_QUALITY: 90
      # depth_preview for the UI at 10 fps.
      PREVIEW_EVERY: 3
      # Colors of depth_preview span DEPTH_MINIMUM to this, in mm.
      PREVIEW_MAXIMUM: 1500
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image_left
      - image_right
      - depth
      - depth_preview

  # USB cameras on the wrists, Arducam B0495 (USB3 2.3MP) behind a powered
  # hub on the front Type-C port. Both report the same serial number, so
  # /dev/v4l/by-id/ has one link for the two of them; they are told apart by
  # the hub port they are plugged into. Moving a camera to another port, or
  # the hub to another PC port, changes these paths.
  - id: wrist-right
    path: ../opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/v4l/by-path/pci-0000:00:14.0-usbv3-0:1.2:1.0-video-index0"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: wrist-left
    path: ../opencv-video-capture
    env:
      # See wrist-right.
      CAPTURE_PATH: "/dev/v4l/by-path/pci-0000:00:14.0-usbv3-0:1.1:1.0-video-index0"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  # Renames the cameras' outputs to the common names. Stops on Quit with the
  # cameras because `camera_tick` is closed, which also closes the outputs
  # that are never sent.
  - id: cameras
    path: ../dora-echo
    inputs:
      camera_wrist_right: wrist-right/image
      camera_wrist_left: wrist-left/image
      camera_head_left: head-zed/image_left
      camera_head_right: head-zed/image_right
      camera_head_depth: head-zed/depth
      camera_head_depth_preview: head-zed/depth_preview
    outputs:
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_head_depth
      - camera_head_depth_preview
      # Not sent by the pedestal.
      - camera_ceiling
