# LEADER=webxr: a Meta Quest in the browser sends controller poses over HTTPS
# 8443. They go through a grip clutch, the IK and a joint-space safety gate
# before they reach the robot:
#
#   webxr --pose/grip--> clutch --target--> ik --position--> gate --cmd--> robot
#                          |                                   ^
#                          +--clutch_state--> hud <--gate_state+    (state_* from the robot)
#
# See docs/teleop.md for why each stage exists and where its numbers come
# from, and leader-ker.yaml for the inputs and outputs common to all leaders.
# scripts/dora-envsubst runs the teleop check on this module before
# `dora run`: the timing and rate couplings below are checked, not hoped for.
module:
  name: leader-webxr
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
    - command
    - state_right
    - state_left
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

# Env paths are relative to dataflow.yaml's directory.
nodes:
  - id: webxr
    path: ../dora-openarm-webxr
    env:
      # scripts/webxr-setup writes these and prints the URL to open.
      TLS_CERTIFICATE_FILE: "tls/server.crt"
      TLS_KEY_FILE: "tls/server.key"
      # Pairing token disabled: any client that reaches the port can drive
      # the robot. Fine over USB (localhost); uncomment before using Wi-Fi.
      # PAIRING_TOKEN_FILE: "tls/pairing_token"
      # view-webxr-sim.yaml shows the simulated head camera (ROBOT=mujoco).
      VIEW_CONFIGURATION_FILE: "${WEBXR_VIEW:-view-webxr.yaml}"
      # Another port when 8443 is taken (e.g. by `tailscale serve`).
      PORT: "${WEBXR_PORT:-8443}"
      # On a LAN the host candidates connect; a STUN server only adds a round
      # trip. A page on https://localhost (USB) relays through
      # scripts/webxr-usb instead (nodes/dora-openarm-webxr/PATCHES.md 18).
      ICE_SERVERS: "[]"
      # The hand-pose timing chain, POSE_TIMEOUT <= clutch --stale-ms <
      # SMOOTHER_RESET_GAP (docs/teleop.md, "Timing"). Checked.
      POSE_TIMEOUT: "0.09"
      SMOOTHER_RESET_GAP: "0.12"
      POSE_GAP_MS: "100"
      # Leaning in or turning the head does not move the arms.
      PIVOT_MODE: "latched"
      # The headset page's own log (connection trouble, dropped frames).
      QUEST_LOG: "out/quest.log"
    inputs:
      # WebXR stops when all its inputs are closed on Quit.
      tick: _mod/tick
      # The head camera view in the headset; see view-webxr.yaml.
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_head_right:
        source: _mod/camera_head_right
        queue_size: 1
      hud: hud/hud
      control: _mod/command
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times

  # Moves an arm only while its grip is squeezed, by the hand's displacement
  # since the squeeze, and holds it otherwise. Keeps the fingertips above the
  # table (the MuJoCo scene's, or TABLE_Z on a real robot), inside reach and
  # on their own side, and rides out input gaps up to 0.5 s without a re-grip.
  # It also runs the left arm's intro, holds the right gripper 60% open and
  # the left one closed.
  - id: clutch
    path: ../dora-openarm-clutch
    args: --scene demo --tick-hz 250
    env:
      ROBOT: "${ROBOT:-dummy}"
      TABLE_Z: "${TABLE_Z:-}"
      # After each Start Arm this arm turns the finger on the right down and
      # opens halfway, waits for X (or Enter in the UI), closes, turns the finger on
      # the left down, and only then follows the grip (docs/teleop.md, Intro).
      # right, left or none.
      INTRO_ARM: "${INTRO_ARM:-left}"
      # on: after each episode (success, fail or cancel) both arms go back to
      # their start poses and that arm runs the intro again, so episodes can
      # follow each other; off: only after Start Arm. The left controller's X
      # stands in for Enter.
      INTRO_EVERY_EPISODE: "${INTRO_EVERY_EPISODE:-on}"
      # These grippers stay at a fixed opening whatever the trigger does, as
      # SIDE=FRACTION of their range (0: closed), e.g. right=0.6, or none. They
      # close after each Start Arm until the arm aligns, then open to it. The
      # left one stays closed once its intro is done.
      FIXED_GRIPPERS: "${FIXED_GRIPPERS:-right=0.6,left=0}"
      # These arms keep the finger that is normally on their right lowest: the
      # hand's roll about the fingers is replaced. After each Start Arm the arm
      # turns into it slowly, once aligned. right, left, right,left or none
      # (off for now: the right arm's pose then sits near J2's and J5's limits).
      FINGER_DOWN: "${FINGER_DOWN:-none}"
    inputs:
      tick: _mod/tick
      pose_right: webxr/pose_right
      pose_left: webxr/pose_left
      grip_right: webxr/grip_right
      grip_left: webxr/grip_left
      # The first state, and the first after Start Arm, is where the arm holds.
      state_right: _mod/state_right
      state_left: _mod/state_left
      control: _mod/command
      # The intro's Enter (docs/teleop.md, Intro).
      button_x: webxr/button_x
    outputs:
      - target_right
      - target_left
      - clutch_state

  # dora-openarm-ik with the gate's joint ranges and 0.9x its speeds, pinned to
  # the fast cores. --tick-hz is the leader tick (dataflow.yaml, 4 ms).
  - id: ik
    path: ../dora-openarm-teleop-ik
    args: --tick-hz 250
    env:
      ROBOT: "${ROBOT:-dummy}"
    inputs:
      # Queued: a late IK must not pair this tick's right with last tick's left.
      target_right:
        source: clutch/target_right
        queue_size: 10
      target_left:
        source: clutch/target_left
        queue_size: 10
    outputs:
      - position_right
      - position_left
      - status

  # Joint-space safety gate: bounded joint speed, jump and range checks, and
  # it holds when the IK or the robot's state goes stale. Its output is what
  # the robot executes and what the recorder stores as the action.
  - id: gate
    path: ../dora-openarm-gate
    env:
      ROBOT: "${ROBOT:-dummy}"
    inputs:
      tick: _mod/tick
      position_right: ik/position_right
      position_left: ik/position_left
      state_right: _mod/state_right
      state_left: _mod/state_left
      control: _mod/command
    outputs:
      - cmd_right
      - cmd_left
      - gate_state

  # What the headset shows: recording or not, each arm's clutch and gate state.
  - id: hud
    path: ../dora-openarm-teleop-hud
    inputs:
      tick: dora/timer/millis/100
      command: _mod/command
      clutch_state: clutch/clutch_state
      gate_state: gate/gate_state
    outputs:
      - hud

  # Renames the gate's outputs to the common `follower_position_*`.
  - id: out
    path: ../dora-echo
    inputs:
      follower_position_right: gate/cmd_right
      follower_position_left: gate/cmd_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by WebXR.
      - ker_position
      - metadata
